name: Export Camp Story Godot Source
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/export-camp-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: original-camp-story-source
          path: camp-story-capture/
          retention-days: 1
